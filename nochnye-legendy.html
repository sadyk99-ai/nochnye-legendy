<head>

<style>
.chat-box{max-height:220px;overflow-y:auto;background:#14110e;border-radius:8px;padding:10px;margin-bottom:10px;font-size:.85rem}
.chat-msg{margin-bottom:8px;line-height:1.35}
.chat-msg .cn{color:var(--accent2);font-weight:600}
.chat-msg .ct{color:var(--text-dim);font-size:.7rem;margin-left:6px}
.chat-input-row{display:flex;gap:6px}
.chat-input-row input{flex:1;background:#221c18;border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-family:inherit;font-size:.9rem}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3a7a4a;margin-right:4px}
.offline-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:4px}
.mail-badge{background:var(--accent);color:#fff;font-size:.7rem;padding:1px 6px;border-radius:10px;margin-left:4px}
:root{--bg:#0d0b0a;--bg2:#161210;--panel:#1c1714;--border:#3a2f28;--accent:#8b1a1a;--accent2:#c9a227;--text:#e8dcc8;--text-dim:#a89880;--hp:#a32d2d;--stamina:#3a7a4a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;line-height:1.45;user-select:none}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
#screen-title{justify-content:center;align-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#1a1210 0%,#0d0b0a 70%)}
.logo{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:700;letter-spacing:.12em;color:var(--accent);text-shadow:0 0 30px rgba(139,26,26,.5);margin-bottom:8px}
.tagline{color:var(--text-dim);font-size:1rem;margin-bottom:48px;letter-spacing:.05em}
.btn{background:var(--accent);color:#fff;border:none;padding:14px 32px;font-size:1.05rem;border-radius:6px;cursor:pointer;transition:.15s;font-weight:600;letter-spacing:.03em;font-family:inherit}
.btn:active{background:#a52222;transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text-dim);margin-top:12px}
#screen-create{padding:20px 16px 40px;max-width:480px;margin:0 auto;width:100%}
.create-step{display:none}
.create-step.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-title{font-size:1.35rem;margin-bottom:20px;color:var(--accent2);text-align:center}
.option-grid{display:grid;gap:10px;margin-bottom:24px}
.option{background:var(--panel);border:1px solid var(--border);padding:14px 16px;border-radius:8px;cursor:pointer;transition:.15s;text-align:left}
.option:active{border-color:var(--accent);background:#241c18}
.option-name{font-weight:600;margin-bottom:4px}
.option-desc{font-size:.85rem;color:var(--text-dim)}
input[type=text]{width:100%;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1.1rem;margin-bottom:20px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:var(--accent)}
.create-nav{display:flex;gap:12px;justify-content:center;margin-top:8px}
#screen-game{max-width:520px;margin:0 auto;width:100%;position:relative}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-top)) 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--panel);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.player-info{flex:1;min-width:0}
.player-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{font-size:.75rem;color:var(--text-dim)}
.bars{width:100%;margin-top:4px}
.bar{height:6px;background:#2a221c;border-radius:3px;overflow:hidden;margin-bottom:3px}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bar-hp .bar-fill{background:var(--hp)}
.bar-stamina .bar-fill{background:var(--stamina)}
.bar-energy .bar-fill{background:var(--accent2)}
.resources{display:flex;gap:10px;font-size:.8rem;color:var(--text-dim)}
.res{display:flex;align-items:center;gap:3px}
.location-header{padding:16px 16px 8px;text-align:center}
.loc-name{font-size:1.25rem;color:var(--accent2);margin-bottom:4px}
.loc-desc{font-size:.9rem;color:var(--text-dim);margin-bottom:12px}
.time-weather{font-size:.8rem;color:var(--text-dim);opacity:.8}
.content{flex:1;padding:0 14px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.panel-title{font-size:.85rem;color:var(--accent2);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase}
.actions{display:grid;gap:8px}
.action-btn{background:#221c18;border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:8px;text-align:left;cursor:pointer;font-size:.95rem;transition:.12s;display:flex;align-items:center;gap:10px;font-family:inherit;width:100%}
.action-btn:active{border-color:var(--accent);background:#2a221c}
.action-btn:disabled{opacity:.45;cursor:not-allowed}
.action-btn .icon{font-size:1.2rem;width:28px;text-align:center}
.log{font-size:.92rem;color:var(--text);line-height:1.55;max-height:180px;overflow-y:auto}
.log p{margin-bottom:8px}
.log .dim{color:var(--text-dim)}
.log .important{color:var(--accent2)}
.log .danger{color:#d9534f}
.bottom-nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:50}
.nav-btn{flex:1;background:none;border:none;color:var(--text-dim);padding:10px 4px;font-size:.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s;font-family:inherit}
.nav-btn.active,.nav-btn:active{color:var(--text)}
.nav-btn .icon{font-size:1.25rem}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#221c18;padding:10px;border-radius:6px;text-align:center}
.stat-label{font-size:.7rem;color:var(--text-dim);margin-bottom:2px}
.stat-value{font-size:1.15rem;font-weight:600}
.combat-area{text-align:center}
.enemy-name{font-size:1.2rem;color:var(--accent);margin-bottom:6px}
.enemy-hp{margin-bottom:16px}
.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;position:relative}
.modal h3{margin-bottom:12px;color:var(--accent2);padding-right:30px}
.modal p{margin-bottom:10px;font-size:.95rem}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-dim);font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;font-family:inherit}
.modal-close:active{color:var(--text)}
@keyframes achSlide{from{transform:translate(-50%,-100px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media(max-width:380px){.logo{font-size:2rem}.action-btn{padding:11px 12px;font-size:.9rem}}
</style>
</head>
<body>

<div id="screen-title" class="screen active">
  <div class="logo">НОЧНЫЕ ЛЕГЕНДЫ</div>
  <div class="tagline">Тёмный мир. Твоя история.</div>
  <button class="btn" onclick="startCreate()">Начать путь</button>
  <button class="btn btn-secondary" onclick="loadGame()" id="btn-continue" style="display:none">Продолжить</button>
  <button class="btn btn-secondary" onclick="resetGame()" id="btn-reset" style="display:none;font-size:.85rem;padding:8px 20px">Начать заново</button>
</div>

<div id="screen-create" class="screen">
  <div class="create-step active" id="step-gender">
    <div class="step-title">1. Выберите пол</div>
    <div class="option-grid">
      <div class="option" onclick="selectGender('male')"><div class="option-name">Мужской</div><div class="option-desc">Визуальные и ролевые отличия</div></div>
      <div class="option" onclick="selectGender('female')"><div class="option-name">Женский</div><div class="option-desc">Визуальные и ролевые отличия</div></div>
    </div>
  </div>
  <div class="create-step" id="step-name">
    <div class="step-title">2. Введите имя</div>
    <input type="text" id="input-name" placeholder="Имя героя..." maxlength="16" autocomplete="off">
    <div class="create-nav">
      <button class="btn btn-secondary" onclick="goStep('gender')">Назад</button>
      <button class="btn" onclick="confirmName()">Далее</button>
    </div>
  </div>
  <div class="create-step" id="step-faction">
    <div class="step-title">3. Выберите фракцию</div>
    <div class="option-grid" id="faction-list"></div>
    <div class="create-nav"><button class="btn btn-secondary" onclick="goStep('name')">Назад</button></div>
  </div>
  <div class="create-step" id="step-class">
    <div class="step-title">4. Выберите класс</div>
    <div class="option-grid" id="class-list"></div>
    <div class="create-nav"><button class="btn btn-secondary" onclick="goStep('faction')">Назад</button></div>
  </div>
  <div class="create-step" id="step-confirm">
    <div class="step-title">Готово к выходу в мир</div>
    <div class="panel" id="confirm-summary"></div>
    <div class="create-nav">
      <button class="btn btn-secondary" onclick="goStep('class')">Назад</button>
      <button class="btn" onclick="finishCreate()">Войти в город</button>
    </div>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="topbar">
    <div class="avatar" id="avatar">⚔</div>
    <div class="player-info">
      <div class="player-name" id="ui-name">—</div>
      <div class="player-meta"><span id="ui-level">Ур. 1</span> · <span id="ui-class">—</span></div>
      <div class="bars">
        <div class="bar bar-hp"><div class="bar-fill" id="bar-hp" style="width:100%"></div></div>
        <div class="bar bar-stamina"><div class="bar-fill" id="bar-stamina" style="width:100%"></div></div>
        <div class="bar bar-energy" style="height:4px"><div class="bar-fill" id="bar-energy" style="width:100%"></div></div>
      </div>
    </div>
    <div class="resources">
      <div class="res">🪙 <span id="ui-gold">0</span></div>
      <div class="res">🔷 <span id="ui-sapphire">0</span></div>
    </div>
  </div>
  <div class="location-header">
    <div class="loc-name" id="loc-name">Город-крепость</div>
    <div class="loc-desc" id="loc-desc">Сердце мира. Здесь всё начинается.</div>
    <div class="time-weather" id="time-weather">☀️ День · Ясно</div>
  </div>
  <div class="content" id="content"></div>
  <div class="bottom-nav">
    <button class="nav-btn active" data-tab="explore" onclick="switchTab('explore')"><span class="icon">🗺️</span><span>Мир</span></button>
    <button class="nav-btn" data-tab="char" onclick="switchTab('char')"><span class="icon">👤</span><span>Герой</span></button>
    <button class="nav-btn" data-tab="inv" onclick="switchTab('inv')"><span class="icon">🎒</span><span>Инвентарь</span></button>
    <button class="nav-btn" data-tab="log" onclick="switchTab('log')"><span class="icon">📜</span><span>Журнал</span></button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-content"></div>
</div>

  city:{id:'city',name:'Город-крепость',desc:'Высокие каменные стены. Фонари качаются на ветру.',actions:[{id:'square',icon:'⛲',label:'Центральная площадь'},{id:'tavern',icon:'🍺',label:'Таверна «Старый Ворон»'},{id:'forge',icon:'🔨',label:'Кузнечный квартал'},{id:'alchemy',icon:'🧪',label:'Алхимик'},{id:'board',icon:'📜',label:'Доска заданий'},{id:'home',icon:'🏠',label:'Дом'},{id:'gate',icon:'🚪',label:'Главные ворота'}]},

function unlockCodex(cat, id, silent){
  if(!state) return false;
  if(!state.codex) state.codex={locations:[],enemies:[],bosses:[]};
  if(!state.codex[cat]) state.codex[cat]=[];
  if(state.codex[cat].indexOf(id)!==-1) return false;
  // проверка что запись существует
  const list = CODEX[cat];
  if(!list || !list.some(e=>e.id===id)) return false;
  state.codex[cat].push(id);
  if(!silent){
    const entry = list.find(e=>e.id===id);
    if(entry) addLog('📖 Кодекс: открыто «'+entry.name+'»','important');
  }
  const total = (state.codex.locations||[]).length+(state.codex.enemies||[]).length+(state.codex.bosses||[]).length;
  if(total>=10) checkAchievement('codex_reader');
  save();
  return true;
}
function isCodexUnlocked(cat, id){
  return !!(state && state.codex && state.codex[cat] && state.codex[cat].indexOf(id)!==-1);
}
function codexUnlockLocation(locId){
  if(!locId) return;
  // маппинг tower_approach / port / tower
  unlockCodex('locations', locId, false);
}
function getCodexProgress(){
  const tLoc=CODEX.locations.length, tEn=CODEX.enemies.length, tBo=CODEX.bosses.length;
  const uLoc=(state&&state.codex&&state.codex.locations||[]).length;
  const uEn=(state&&state.codex&&state.codex.enemies||[]).length;
  const uBo=(state&&state.codex&&state.codex.bosses||[]).length;
  return {uLoc,tLoc,uEn,tEn,uBo,tBo, total:uLoc+uEn+uBo, max:tLoc+tEn+tBo};
}

const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
// Если config пустой — онлайн в режиме «локально» (чат/друзья/письма только на этом устройстве для теста UI)

const Online = {
  ready: false,
  db: null,
  playerId: null,
  atTable: false,
  chatUnsub: null,
  presenceTimer: null,
  friends: {},
  mail: [],
  onlinePlayers: {},
  localChat: [], // fallback без Firebase
  localMail: {},
  localFriends: {},

  isConfigured(){
    return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.apiKey);
  },

  getPlayerId(){
    let id = localStorage.getItem(PLAYER_ID_KEY);
    if(!id){
      id = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
      localStorage.setItem(PLAYER_ID_KEY, id);
    }
    return id;
  },

  init(){
    this.playerId = this.getPlayerId();
    if(!this.isConfigured()){
      this.ready = false;
      try{
        this.localMail = JSON.parse(localStorage.getItem('cryfantasy_local_mail')||'{}');
        this.localFriends = JSON.parse(localStorage.getItem('cryfantasy_local_friends')||'{}');
        this.localChat = JSON.parse(localStorage.getItem('cryfantasy_local_chat')||'[]');
      }catch(e){}
      return;
    }
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.database();
      this.ready = true;
    }catch(e){
      console.warn('Firebase init failed', e);
      this.ready = false;
    }
  },

  profile(){
    if(!state) return {name:'Странник',level:1,classId:''};
    return {
      name: state.name || 'Странник',
      level: state.level || 1,
      classId: state.classId || '',
      lastSeen: Date.now(),
      online: true
    };
  },

  goOnline(){
    this.init();
    if(!this.ready || !this.db) return;
    const ref = this.db.ref('players/'+this.playerId);
    ref.set(this.profile());
    ref.onDisconnect().update({online:false, lastSeen: Date.now()});
    if(this.presenceTimer) clearInterval(this.presenceTimer);
    this.presenceTimer = setInterval(()=>{
      if(this.db && state) this.db.ref('players/'+this.playerId).update(this.profile());
    }, 25000);
    this.loadFriends();
    this.loadMail();
  },

  goOffline(){
    if(this.presenceTimer){ clearInterval(this.presenceTimer); this.presenceTimer=null; }
    this.leaveTable();
    if(this.ready && this.db){
      this.db.ref('players/'+this.playerId).update({online:false, lastSeen: Date.now()});
    }
  },

  sitAtTable(){
    this.atTable = true;
    if(this.ready && this.db){
      const chatRef = this.db.ref('chat/tavern').orderByChild('ts').limitToLast(40);
      chatRef.off();
      this.chatUnsub = chatRef.on('value', snap=>{
        const list=[];
        snap.forEach(c=>{ list.push(Object.assign({id:c.key}, c.val())); });
        list.sort((a,b)=> (a.ts||0)-(b.ts||0));
        this._chatCache = list;
        if(state && state.location==='tavern' && this.atTable) renderTavernChat();
      });
    }else{
      this._chatCache = this.localChat.slice(-40);
    }
  },

  leaveTable(){
    this.atTable = false;
    if(this.ready && this.db){
      try{ this.db.ref('chat/tavern').off(); }catch(e){}
    }
    this.chatUnsub = null;
  },

  sendChat(text){
    text = (text||'').trim().slice(0,200);
    if(!text || !state) return;
    const msg = {
      from: this.playerId,
      name: state.name || 'Странник',
      text: text,
      ts: Date.now()
    };
    if(this.ready && this.db){
      this.db.ref('chat/tavern').push(msg);
    }else{
      this.localChat.push(msg);
      if(this.localChat.length>50) this.localChat = this.localChat.slice(-50);
      localStorage.setItem('cryfantasy_local_chat', JSON.stringify(this.localChat));
      this._chatCache = this.localChat.slice(-40);
      if(this.atTable) renderTavernChat();
    }
  },

  loadFriends(){
    if(this.ready && this.db){
      this.db.ref('friends/'+this.playerId).once('value').then(snap=>{
        this.friends = snap.val() || {};
        // подтянуть статусы
        Object.keys(this.friends).forEach(fid=>{
          this.db.ref('players/'+fid).once('value').then(ps=>{
            if(ps.val()) this.onlinePlayers[fid] = ps.val();
          });
        });
      });
    }else{
      this.friends = this.localFriends || {};
    }
  },

  addFriend(friendId){
    friendId = (friendId||'').trim();
    if(!friendId || friendId===this.playerId) return Promise.resolve({ok:false, err:'Некорректный ID'});
    if(this.ready && this.db){
      return this.db.ref('players/'+friendId).once('value').then(snap=>{
        if(!snap.exists()) return {ok:false, err:'Игрок не найден'};
        const p = snap.val();
        return this.db.ref('friends/'+this.playerId+'/'+friendId).set({
          name: p.name||'Странник', addedAt: Date.now()
        }).then(()=>{
          this.friends[friendId] = {name: p.name||'Странник', addedAt: Date.now()};
          this.onlinePlayers[friendId] = p;
          return {ok:true, name: p.name};
        });
      });
    }else{
      this.localFriends[friendId] = {name: 'Игрок '+friendId.slice(-4), addedAt: Date.now()};
      localStorage.setItem('cryfantasy_local_friends', JSON.stringify(this.localFriends));
      this.friends = this.localFriends;
      return Promise.resolve({ok:true, name: this.localFriends[friendId].name});
    }
  },

  removeFriend(friendId){
    if(this.ready && this.db){
      this.db.ref('friends/'+this.playerId+'/'+friendId).remove();
    }
    delete this.friends[friendId];
    if(!this.ready){
      delete this.localFriends[friendId];
      localStorage.setItem('cryfantasy_local_friends', JSON.stringify(this.localFriends));
    }
  },

  loadMail(){
    if(this.ready && this.db){
      this.db.ref('mail/'+this.playerId).orderByChild('ts').limitToLast(30).once('value').then(snap=>{
        const list=[];
        snap.forEach(c=> list.push(Object.assign({id:c.key}, c.val())));
        list.sort((a,b)=> (b.ts||0)-(a.ts||0));
        this.mail = list;
        this._updateMailBadge();
      });
    }else{
      const box = (this.localMail && this.localMail[this.playerId]) || [];
      this.mail = box.slice().sort((a,b)=> (b.ts||0)-(a.ts||0));
      this._updateMailBadge();
    }
  },

  unreadCount(){
    return (this.mail||[]).filter(m=>!m.read).length;
  },

  _updateMailBadge(){
    // обновление при рендере персонажа/таверны
  },

  sendLetter(toId, subject, body){
    toId = (toId||'').trim();
    subject = (subject||'Без темы').trim().slice(0,80);
    body = (body||'').trim().slice(0,1000);
    if(!toId || !body || !state) return Promise.resolve({ok:false, err:'Заполни поля'});
    const letter = {
      from: this.playerId,
      fromName: state.name || 'Странник',
      subject, body,
      ts: Date.now(),
      read: false
    };
    if(this.ready && this.db){
      return this.db.ref('players/'+toId).once('value').then(snap=>{
        if(!snap.exists()) return {ok:false, err:'Игрок не найден'};
        return this.db.ref('mail/'+toId).push(letter).then(()=>({ok:true}));
      });
    }else{
      if(!this.localMail[toId]) this.localMail[toId]=[];
      letter.id = 'L'+Date.now();
      this.localMail[toId].push(letter);
      localStorage.setItem('cryfantasy_local_mail', JSON.stringify(this.localMail));
      // если письмо себе — обновить
      if(toId===this.playerId) this.loadMail();
      return Promise.resolve({ok:true});
    }
  },

  markRead(letterId){
    const m = (this.mail||[]).find(x=>x.id===letterId);
    if(m) m.read = true;
    if(this.ready && this.db){
      this.db.ref('mail/'+this.playerId+'/'+letterId+'/read').set(true);
    }else{
      const box = this.localMail[this.playerId]||[];
      const found = box.find(x=>x.id===letterId);
      if(found) found.read=true;
      localStorage.setItem('cryfantasy_local_mail', JSON.stringify(this.localMail));
    }
  }
};

let state=null;

function $(id){return document.getElementById(id)}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function addLog(text,cls){if(!state)return;if(!state.log)state.log=[];state.log.unshift({text,cls:cls||'',time:Date.now()});if(state.log.length>60)state.log.pop()}
function save(){if(!state)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;state=JSON.parse(raw);migrateState();return true}catch(e){return false}}

function migrateState(){
  if(!state)return;
  const d={
    activeQuests:[],energy:10,maxEnergy:10,lastEnergyRestore:Date.now(),lastWeatherUpdate:Date.now(),
    currentQuest:null,achievements:[],travelCount:0,flags:{},inventory:[],maxSlots:20,
    equipped:{weapon:null,armor:null},upgrades:{},letters:[],isTravelling:false,travel:null,
    quests:[],drunkLevel:0,combatBusy:false,
    kills:0,questsCompleted:0,craftedPotions:0,sapphire:0,
    towerFloor:0,towerMaxFloor:0,towerKeys:{},towerBossesDefeated:[],
    codex:{locations:[],enemies:[],bosses:[]}
  };
  Object.keys(d).forEach(k=>{if(state[k]===undefined)state[k]=d[k]});
  if(!state.equipped) state.equipped={weapon:null,armor:null};
  if(!Array.isArray(state.inventory)) state.inventory=[];
  if(!Array.isArray(state.activeQuests)) state.activeQuests=[];
  if(!Array.isArray(state.achievements)) state.achievements=[];
  if(!state.towerKeys || typeof state.towerKeys!=='object') state.towerKeys={};
  if(!Array.isArray(state.towerBossesDefeated)) state.towerBossesDefeated=[];
  if(!state.codex || typeof state.codex!=='object') state.codex={locations:[],enemies:[],bosses:[]};
  if(!Array.isArray(state.codex.locations)) state.codex.locations=[];
  if(!Array.isArray(state.codex.enemies)) state.codex.enemies=[];
  if(!Array.isArray(state.codex.bosses)) state.codex.bosses=[];
  // Принудительные флаги
  state.isTravelling=!!state.travel;
  state.inCombat=false;
  state.combatBusy=false;
  if(typeof state.sapphire!=='number') state.sapphire=0;
  if(typeof state.level!=='number'||state.level<1) state.level=1;
  if(state.level>MAX_LEVEL) state.level=MAX_LEVEL;
}

function resetGame(){
  if(!confirm('Начать заново? Текущий прогресс будет удалён.'))return;
  localStorage.removeItem(SAVE_KEY);
  state=null;
  $('btn-continue').style.display='none';
  $('btn-reset').style.display='none';
  showScreen('screen-title');
}

function renderFactions(){const list=$('faction-list');list.innerHTML='';Object.values(FACTIONS).forEach(f=>{const div=document.createElement('div');div.className='option';div.innerHTML='<div class="option-name">'+f.icon+' '+f.name+'</div><div class="option-desc">'+f.desc+'</div>';div.onclick=()=>{state.faction=f.id;goStep('class')};list.appendChild(div)})}
function renderClasses(){const list=$('class-list');list.innerHTML='';const faction=FACTIONS[state.faction];faction.classes.forEach(cid=>{const c=CLASSES[cid];const name=c.name[state.gender];const div=document.createElement('div');div.className='option';div.innerHTML='<div class="option-name">'+c.icon+' '+name+'</div><div class="option-desc">'+c.desc+'</div><div class="option-desc" style="margin-top:6px;font-size:.8rem">❤️'+c.stats.hp+' 💪'+c.stats.strength+' 🛡️'+c.stats.defense+' 🏃'+c.stats.agility+' 🔮'+c.stats.magic+'</div>';div.onclick=()=>{state.classId=cid;goStep('confirm')};list.appendChild(div)})}
function renderConfirm(){const c=CLASSES[state.classId];const f=FACTIONS[state.faction];const name=c.name[state.gender];$('confirm-summary').innerHTML='<p><b>'+state.name+'</b></p><p>'+f.icon+' '+f.name+'</p><p>'+c.icon+' '+name+'</p><p style="margin-top:10px;font-size:.9rem;color:var(--text-dim)">❤️ '+c.stats.hp+' &nbsp; 💪 '+c.stats.strength+' &nbsp; 🛡️ '+c.stats.defense+'<br>🏃 '+c.stats.agility+' &nbsp; 🔮 '+c.stats.magic+' &nbsp; 🧠 '+c.stats.intelligence+' &nbsp; 🍀 '+c.stats.luck+'</p>'}
function finishCreate(){const c=CLASSES[state.classId];state.stats=Object.assign({},c.stats);state.maxHp=c.stats.hp;state.hp=c.stats.hp;state.maxStamina=100;state.stamina=100;state.location='city';addLog('Ты прибыл в Город-крепость.','important');addLog('Каменные стены. Фонари. Запах дыма и стали.');addLog('Мир ждёт.');save();enterGame()}
function enterGame(){
  showScreen('screen-game');
  checkEnergyRestore();
  updateTimeAndWeather();
  updateUI();
  Online.goOnline();
  Online.loadMail();
  const unread = Online.unreadCount();
  if(unread>0) addLog('✉️ Тебе писем: '+unread+'. Открой «Письма» в таверне или у героя.','important');

window.addEventListener('beforeunload',()=>{ try{ Online.goOffline(); }catch(e){} });
function loadGame(){if(load())enterGame()}

// ========== ИНТЕРФЕЙС ==========
function updateUI(){
  if(!state||!state.classId)return;
  const c=CLASSES[state.classId];
  $('ui-name').textContent=state.name;
  $('ui-level').textContent='Ур. '+state.level;
  $('ui-class').textContent=c?c.name[state.gender]:'—';
  $('ui-gold').textContent=state.gold;
  $('ui-sapphire').textContent=state.sapphire;
  $('bar-hp').style.width=Math.max(0,state.hp/state.maxHp*100)+'%';
  $('bar-stamina').style.width=Math.max(0,state.stamina/state.maxStamina*100)+'%';
  $('bar-energy').style.width=Math.max(0,state.energy/state.maxEnergy*100)+'%';
  $('avatar').textContent=c?c.icon:'⚔';
  const tp=TIME_PHASES[state.timePhase]||TIME_PHASES.day;
  const w=WEATHERS[state.weather]||WEATHERS.clear;
  $('time-weather').textContent=tp.icon+' '+tp.name+' · '+w.icon+' '+w.name;
}

function switchTab(tab){
  if(!state)return;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector('.nav-btn[data-tab="'+tab+'"]');
  if(btn)btn.classList.add('active');
  if(state.isTravelling){renderTravelScreen();return}
  if(state.inCombat){renderCombat();return}
  if(tab==='explore')renderLocation();
  else if(tab==='char')renderCharacter();
  else if(tab==='inv')renderInventory();
  else if(tab==='log')renderLog();
}

function renderLocation(){
  if(!state||state.isTravelling||state.inCombat)return;
  if(state.location==='tower')return renderTowerFloor();
  const loc=LOCATIONS[state.location];
  if(!loc)return;
  $('loc-name').textContent=loc.name;
  $('loc-desc').textContent=loc.desc;
  if(state.location==='tavern')return renderTavern();
  let html='';
  if(state.activeQuests.length>0&&state.location==='city'){
    html+='<div class="panel"><div class="panel-title">Активные задания</div>';
    state.activeQuests.forEach(aq=>{
      const q=getQuestById(aq.questId);
      if(!q)return;
      const r=Math.max(0,Math.ceil((aq.endsAt-Date.now())/1000));
      html+='<div style="padding:8px;background:#221c18;border-radius:6px;margin-bottom:6px;font-size:.85rem">'+q.icon+' '+q.name+' — <span style="color:var(--accent2)">'+r+' сек.</span></div>';
    });
    html+='</div>';
  }
  html+='<div class="panel"><div class="panel-title">Действия</div><div class="actions">';
  loc.actions.forEach(a=>{html+='<button class="action-btn" onclick="doAction(\''+a.id+'\')"><span class="icon">'+a.icon+'</span><span>'+a.label+'</span></button>'});
  html+='</div></div>';
  if(state.log.length){
    html+='<div class="panel"><div class="panel-title">Недавнее</div><div class="log">';
    state.log.slice(0,4).forEach(l=>{html+='<p class="'+l.cls+'">'+l.text+'</p>'});
    html+='</div></div>';
  }
  $('content').innerHTML=html;
}

function doAction(id){
  if(!state||state.inCombat||state.isTravelling)return;
  if(LOCATIONS[id]){
    state.location=id;
    addLog('Ты пришёл в: '+LOCATIONS[id].name);
    codexUnlockLocation(id);
    save();
    renderLocation();
    return;
  }
  if(id.startsWith('travel_')){
    const dest=id.replace('travel_','');
    const map={cemetery:'cemetery',ruins:'ruins',forest:'forest',rocks:'rocks',tower:'tower_approach'};
    if(map[dest]){travelTo(map[dest]);return}
  }
  switch(id){
    case 'look':addLog('Ты осматриваешься. Старый фонтан. Вороны. Стражники у стен.');renderLocation();break;
    case 'fountain':addLog('Вода в фонтане мутная. На дне — старые монеты.');renderLocation();break;
    case 'people':addLog('На площади несколько человек: стражник, торговец и двое путников.');renderLocation();break;
    case 'look_forge':addLog('Кузнец работает. Искры летят из-под молота.');renderLocation();break;
    case 'look_alchemy':addLog('Стол алхимика. Книги. Травы. Реагенты.');renderLocation();break;
    case 'look_home':addLog('Камин потрескивает. На столе — Книга странника.');renderLocation();break;
    case 'look_forest':addLog('Ты прислушиваешься. Где-то треснула ветка.');renderLocation();break;
    case 'listen':addLog('Волны бьются о скалы. Ветер.');renderLocation();break;
    case 'sit_rocks':addLog('Ты садишься на холодный камень.');renderLocation();break;
    case 'look_sea':addLog('Горизонт тонет в тумане.');renderLocation();break;
    case 'weapons':case 'armor':showBlacksmith();break;
    case 'upgrade':showUpgradeMenu();break;
    case 'alchemist_shop':showAlchemist();break;
    case 'take_quest':showQuestBoard();break;
    case 'rest':state.hp=state.maxHp;state.stamina=state.maxStamina;addLog('Ты отдыхаешь у камина.','important');updateUI();renderLocation();save();break;
    case 'chronicle':showChronicle();break;
    case 'keeper':showKeeperDialog();break;
    case 'explore':exploreLocation();break;
    case 'fight':startRandomCombat();break;
    case 'enter_tower':enterTower();break;
    case 'boatman':showBoatmanDialog();break;
    case 'tower_next':towerNextFloor();break;
    case 'tower_fight':towerFightTrash();break;
    case 'tower_boss':towerFightBoss();break;
    case 'tower_leave':state.location='tower_approach';state.towerFloor=0;addLog('Ты покидаешь Башню.');renderLocation();save();break;
    default:addLog('Пока недоступно.');renderLocation();
  }
  save();
}

function exploreLocation(){
  const roll=Math.random();
  if(roll<0.45){startRandomCombat()}
  else if(roll<0.65){const g=5+Math.floor(Math.random()*20);state.gold+=g;addLog('Ты находишь '+g+' 🪙','important');updateUI();renderLocation()}
  else if(roll<0.8){const items=['herb','scrap','rag','bone'];const i=items[Math.floor(Math.random()*items.length)];addItem(ITEMS[i]);renderLocation()}
  else if(roll<0.9){addLog('Ты находишь старое письмо.','important');addItem(ITEMS.old_letter);renderLocation()}
  else{addLog('Ничего. Только тишина.');renderLocation()}
  save();
}
function startRandomCombat(){
  const enemies={forest:['wolf','bandit','boar'],cemetery:['skeleton','shadow'],ruins:['bandit','shadow'],rocks:['wolf']};
  const pool=enemies[state.location]||['wolf'];
  const eid=pool[Math.floor(Math.random()*pool.length)];
  const base=ENEMIES.find(e=>e.id===eid);
  startCombat(base);
}

// ========== ПУТЕШЕСТВИЕ ==========
function travelTo(locId){
  const times={cemetery:15,ruins:25,forest:40,rocks:35,tower_approach:50};
  const duration=times[locId]||20;
  state.isTravelling=true;
  state.travel={destId:locId,destName:LOCATIONS[locId].name,startedAt:Date.now(),duration,events:generateTravelEvents(duration),rendered:[]};
  state.travelCount=(state.travelCount||0)+1;
  if(state.travelCount>=10)checkAchievement('traveler');
  addLog('🛤️ Ты отправляешься: '+LOCATIONS[locId].name);
  renderTravelScreen();
  save();
}
function generateTravelEvents(duration){
  const count=Math.max(2,Math.floor(duration/8));
  const events=[];
  const total=TRAVEL_EVENTS.reduce((s,e)=>s+e.weight,0);
  for(let i=0;i<count;i++){
    let roll=Math.random()*total;
    for(const ev of TRAVEL_EVENTS){
      roll-=ev.weight;
      if(roll<=0){events.push(Object.assign({},ev,{resolved:false}));break}
    }
  }
  return events;
}
function renderTravelScreen(){
  if(!state||!state.travel){if(state)state.isTravelling=false;return renderLocation()}
  const t=state.travel;
  const elapsed=(Date.now()-t.startedAt)/1000;
  const remaining=Math.max(0,t.duration-elapsed);
  const progress=Math.min(100,elapsed/t.duration*100);
  if(remaining<=0){arriveAtDestination();return}
  const eventInterval=t.duration/t.events.length;
  const idx=Math.min(t.events.length-1,Math.floor(elapsed/eventInterval));
  let logHtml='';
  t.events.slice(0,idx+1).forEach((ev,i)=>{
    if(i===idx&&!ev.resolved)resolveTravelEvent(ev);
    const color=ev.type==='combat'?'var(--accent)':ev.type==='find'?'var(--accent2)':'var(--text)';
    logHtml+='<p style="margin-bottom:6px;color:'+color+'">'+ev.text+'</p>';
  });
  $('loc-name').textContent='🛤️ В пути';
  $('loc-desc').textContent='→ '+t.destName;
  $('content').innerHTML=
    '<div class="panel"><div class="panel-title">Путешествие</div>'+
    '<div style="font-size:.9rem;margin-bottom:8px">Идём к: <b>'+t.destName+'</b></div>'+
    '<div class="bar" style="height:8px;background:#2a221c;margin-bottom:6px"><div class="bar-fill" style="width:'+progress+'%;background:var(--accent2)"></div></div>'+
    '<div style="font-size:.8rem;color:var(--text-dim);text-align:center">Осталось: ~'+Math.ceil(remaining)+' сек.</div></div>'+
    '<div class="panel"><div class="panel-title">Что происходит в пути</div><div style="font-size:.9rem;line-height:1.6">'+logHtml+'</div></div>'+
    '<button class="action-btn" onclick="abortTravel()">← Отступить</button>';
  // Не запускаем новый таймер — глобальный интервал сам перерисует
}
function resolveTravelEvent(ev){
  ev.resolved=true;
  if(ev.type==='find'&&ev.reward){
    if(ev.reward.gold){
      const min=ev.reward.gold[0],max=ev.reward.gold[1];
      const g=min+Math.floor(Math.random()*(max-min+1));
      state.gold+=g;ev.text+=' (+'+g+' 🪙)';updateUI();
    }
    if(ev.reward.item){
      const item=ITEMS[ev.reward.item];
      if(addItem(item,ev.reward.qty||1))ev.text+=' (+'+item.name+')';
    }
    if(ev.reward.sapphire){
      state.sapphire = (state.sapphire || 0) + ev.reward.sapphire;
      ev.text += ' (+'+ev.reward.sapphire+' 🔷)';
      checkAchievement('sapphire_owner');
      updateUI();
    }
  }
  if(ev.type==='npc'&&ev.reward&&ev.reward.heal){
    state.hp=Math.min(state.maxHp,state.hp+ev.reward.heal);
    ev.text+=' (+'+ev.reward.heal+' HP)';updateUI();
  }
  if(ev.type==='combat'){
    state.travel.combatPending=true;
    setTimeout(()=>{
      if(!state||!state.travel)return;
      const destId=state.travel.destId;
      state.isTravelling=false;
      state.travel=null;
      state.location=destId;
      const enemy=ENEMIES[Math.floor(Math.random()*ENEMIES.length)];
      startCombat(enemy);
    },1500);
  }
  save();
}
function arriveAtDestination(){
  if(!state.travel)return;
  const destId=state.travel.destId;
  state.isTravelling=false;
  state.travel=null;
  state.location=destId;
  addLog('🏁 Ты прибыл в: '+LOCATIONS[destId].name,'important');
  if(destId==='forest')checkAchievement('forest_visit');
  if(destId==='cemetery')checkAchievement('cemetery_visit');
  if(destId==='ruins')checkAchievement('ruins_visit');
  codexUnlockLocation(destId);
  updateUI();renderLocation();save();
}
function abortTravel(){
  if(!state.travel)return;
  state.isTravelling=false;
  state.travel=null;
  addLog('Ты возвращаешься в город.');
  renderLocation();save();
}

// ========== БОЙ ==========
function startCombat(enemyData){
  if(!enemyData)return;
  const enemy=Object.assign({},enemyData);
  enemy.currentHp=enemy.hp;
  state.enemy=enemy;
  state.inCombat=true;
  state.combatBusy=false;
  addLog('⚔️ На тебя нападает '+enemy.name+'!','important');
  updateUI();renderCombat();
}
function renderCombat(){
  if(!state.enemy)return renderLocation();
  const e=state.enemy;
  const hpP=Math.max(0,e.currentHp/e.hp*100);
  const playerP=Math.max(0,state.hp/state.maxHp*100);
  let phaseText='';
  if(e.isBoss && e.phases > 1){
    phaseText=' <span style="color:var(--accent2);font-size:.85rem">[Фаза '+(e.phase||1)+'/'+e.phases+']</span>';
  }
  $('loc-name').textContent='⚔️ Бой';
  $('loc-desc').textContent=e.icon+' '+e.name;
  $('content').innerHTML=
    '<div class="panel combat-area">'+
    '<div class="enemy-name">'+e.icon+' '+e.name+phaseText+'</div>'+
    '<div class="enemy-hp"><div class="bar bar-hp" style="height:12px;margin:0 auto;max-width:220px"><div class="bar-fill" style="width:'+hpP+'%"></div></div><div style="font-size:.9rem;margin-top:4px;color:var(--text-dim)">'+Math.max(0,Math.ceil(e.currentHp))+' / '+e.hp+' HP</div></div>'+
    '<div style="margin:14px 0;padding:10px;background:#221c18;border-radius:8px"><div style="font-size:.8rem;color:var(--text-dim);margin-bottom:4px">Твоё HP</div><div class="bar bar-hp" style="height:10px"><div class="bar-fill" style="width:'+playerP+'%"></div></div><div style="font-size:.85rem;margin-top:3px">'+state.hp+' / '+state.maxHp+'</div></div>'+
    '<div class="log" style="text-align:left;max-height:110px;margin-bottom:12px">'+state.log.slice(0,4).map(l=>'<p class="'+l.cls+'">'+l.text+'</p>').join('')+'</div>'+
    '<div class="combat-actions"><button class="action-btn" onclick="combatAttack()" '+(state.combatBusy?'disabled':'')+'>⚔️ Атака</button><button class="action-btn" onclick="combatDefend()" '+(state.combatBusy?'disabled':'')+'>🛡️ Защита</button><button class="action-btn" onclick="combatSkill()" '+(state.combatBusy?'disabled':'')+'>✨ Способность</button><button class="action-btn" onclick="combatFlee()" '+(state.combatBusy?'disabled':'')+'>🏃 Бежать</button></div>'+
    '</div>';
}
function getPlayerDefense(){
  let def = state.stats.defense || 0;
  if(state.equipped && state.equipped.armor && ITEMS[state.equipped.armor]){
    def += (ITEMS[state.equipped.armor].def || 0) + ((state.upgrades && state.upgrades[state.equipped.armor]) || 0);
  }
  return def;
}
function enemyTurn(afterFn){
  const e=state.enemy;
  if(!e)return;
  // Фазы Владыки Башни
  if(e.isBoss && e.special==='lord_phases'){
    const hpPct = e.currentHp / e.hp;
    const oldPhase = e.phase || 1;
    if(hpPct <= 0.33) e.phase = 3;
    else if(hpPct <= 0.66) e.phase = 2;
    else e.phase = 1;
    if(e.phase !== oldPhase){
      if(e.phase===2){
        addLog('⚡ Владыка Башни входит во 2-ю фазу! Сила растёт.','danger');
        e.strength += 5;
        e.defense = Math.max(0, e.defense - 2);
      }else if(e.phase===3){
        addLog('🔥 Владыка Башни входит в финальную фазу! Он в ярости!','danger');
        e.strength += 7;
        e.defense = Math.max(0, e.defense - 3);
      }
    }
  }
  const playerDef = getPlayerDefense();
  let edmg = Math.max(1, e.strength + Math.floor(Math.random()*4) - Math.floor(playerDef/2));
  let specialUsed = false;
  // Уникальные способности боссов
  if(e.isBoss && e.special && Math.random() < 0.35){
    specialUsed = true;
    switch(e.special){
      case 'heavy_strike':
        edmg = Math.floor(edmg * 1.6);
        addLog('🛡️ '+e.name+' наносит Тяжёлый удар! '+edmg+' урона.','danger');
        break;
      case 'drain':
        edmg = Math.floor(edmg * 0.9);
        const heal = Math.floor(edmg * 0.5);
        e.currentHp = Math.min(e.hp, e.currentHp + heal);
        addLog('👑 '+e.name+' высасывает жизнь! '+edmg+' урона, восстанавливает '+heal+' HP.','danger');
        break;
      case 'shadow_clone':
        edmg = Math.floor(edmg * 0.7);
        addLog('👤 '+e.name+' создаёт теневой клон! Двойной удар: '+edmg+' + '+Math.floor(edmg*0.6)+'.','danger');
        state.hp = Math.max(0, state.hp - Math.floor(edmg*0.6));
        break;
      case 'shield_wall':
        e.defense = (e.defense||0) + 3;
        edmg = Math.floor(edmg * 0.5);
        addLog('🪖 '+e.name+' поднимает Стену щитов! Защита повышена.','danger');
        break;
      case 'flood':
        edmg = Math.floor(edmg * 1.3);
        state.stamina = Math.max(0, state.stamina - 15);
        addLog('🌊 '+e.name+' вызывает Потоп! '+edmg+' урона, -15 выносливости.','danger');
        break;
      case 'rune_blast':
        edmg = Math.floor(edmg * 1.4) + 5;
        addLog('🧙 '+e.name+' выпускает Рунный взрыв! '+edmg+' урона.','danger');
        break;
      case 'execute':
        if(state.hp / state.maxHp < 0.3){
          edmg = Math.floor(edmg * 2.2);
          addLog('🪓 '+e.name+' использует Казнь! Критический удар: '+edmg+'.','danger');
        }else{
          edmg = Math.floor(edmg * 1.2);
          addLog('🪓 '+e.name+' замахивается топором! '+edmg+' урона.','danger');
        }
        break;
      case 'tower_strike':
        edmg = Math.floor(edmg * 1.5);
        addLog('🗼 '+e.name+' наносит Удар с высоты! '+edmg+' урона.','danger');
        break;
      case 'lord_phases':
        if(e.phase === 3){
          edmg = Math.floor(edmg * 1.8);
          addLog('👑 Владыка Башни обрушивает Ярость Тьмы! '+edmg+' урона.','danger');
        }else if(e.phase === 2){
          edmg = Math.floor(edmg * 1.3);
          addLog('👑 Владыка Башни использует Тёмный импульс! '+edmg+' урона.','danger');
        }else{
          specialUsed = false;
        }
        break;
      default:
        specialUsed = false;
    }
  }
  if(!specialUsed){
    addLog('💥 '+e.name+' наносит тебе '+edmg+'.');
  }
  state.hp = Math.max(0, state.hp - edmg);
  state.combatBusy = false;
  if(state.hp <= 0){ endCombat(false); return; }
  updateUI(); renderCombat(); save();
  if(afterFn) afterFn();
}
function combatAttack(){
  if(!state.inCombat||state.combatBusy)return;
  state.combatBusy=true;
  const e=state.enemy;
  const wB=state.equipped && state.equipped.weapon && ITEMS[state.equipped.weapon] ? (ITEMS[state.equipped.weapon].dmg + ((state.upgrades && state.upgrades[state.equipped.weapon]) || 0)) : 0;
  const dmg=Math.max(1,state.stats.strength+wB+Math.floor(Math.random()*6)-e.defense);
  e.currentHp-=dmg;
  addLog('⚔️ Ты наносишь '+dmg+' урона.','important');
  if(e.currentHp<=0){endCombat(true);return}
  setTimeout(()=>enemyTurn(),450);
}
function combatDefend(){
  if(!state.inCombat||state.combatBusy)return;
  state.combatBusy=true;
  addLog('Ты принимаешь защитную стойку.');
  setTimeout(()=>{
    const e=state.enemy;
    if(!e)return;
    const playerDef = getPlayerDefense();
    const edmg=Math.max(1,Math.floor((e.strength+Math.floor(Math.random()*3)-playerDef)/2));
    state.hp=Math.max(0,state.hp-edmg);
    addLog(e.name+' бьёт, но ты блокируешь ('+edmg+').');
    state.combatBusy=false;
    if(state.hp<=0){endCombat(false);return}
    updateUI();renderCombat();save();
  },400);
}
function combatSkill(){
  if(!state.inCombat||state.combatBusy)return;
  const mag=state.stats.magic;
  if(mag<5){addLog('Недостаточно магии.');renderCombat();return}
  state.combatBusy=true;
  const e=state.enemy;
  const dmg=Math.max(1,mag+Math.floor(Math.random()*8));
  e.currentHp-=dmg;
  state.stamina=Math.max(0,state.stamina-15);
  addLog('Способность! '+dmg+' урона.');
  if(e.currentHp<=0){endCombat(true);return}
  setTimeout(()=>enemyTurn(),400);
}
function combatFlee(){
  if(!state.inCombat||state.combatBusy)return;
  state.combatBusy=true;
  if(Math.random()<0.55){
    addLog('Ты успешно сбежал!','important');
    state.inCombat=false;
    state.enemy=null;
    state.combatBusy=false;
    if(state.currentQuest){
      addLog('Задание провалено — враг ушёл.','danger');
      state.currentQuest=null;
    }
    if(state.location==='tower') renderTowerFloor();
    else renderLocation();
    save();
  }else{
    addLog('Побег не удался!','danger');
    setTimeout(()=>enemyTurn(),400);
  }
}
function endCombat(won){
  state.inCombat=false;
  state.combatBusy=false;
  const e=state.enemy;
  const wasQuest = !!state.currentQuest;
  if(won&&e){
    let xpGain=e.xp;
    let goldGain=e.gold[0]+Math.floor(Math.random()*(e.gold[1]-e.gold[0]+1));
    let sapphireGain=0;
    let questName = '';
    // Награда за квест (если бой был по заданию)
    if(state.currentQuest){
      let q = QUESTS.find(x => x.id === state.currentQuest);
      let isKeyQuest = false;
      if(!q){
        q = TOWER_KEY_QUESTS.find(x => x.id === state.currentQuest);
        isKeyQuest = !!q;
      }
      if(q && q.reward){
        xpGain += q.reward.xp || 0;
        goldGain += q.reward.gold || 0;
        sapphireGain += q.reward.sapphire || 0;
        questName = q.name;
        state.questsCompleted = (state.questsCompleted || 0) + 1;
        if(state.questsCompleted >= 5) checkAchievement('quest_master');
      }
      // Ключ Башни — только из квеста на ключ
      if(isKeyQuest && q.keyId && ITEMS[q.keyId]){
        if(!hasTowerKey(q.keyId)){
          addItem(ITEMS[q.keyId]);
          if(!state.towerKeys) state.towerKeys = {};
          state.towerKeys[q.keyId] = true;
          addLog('🔑 Получен ключ: '+ITEMS[q.keyId].name+'!','important');
        }
      }
    }
    state.xp+=xpGain;
    state.gold+=goldGain;
    if(sapphireGain > 0){
      state.sapphire = (state.sapphire || 0) + sapphireGain;
      addLog('🔷 Получен сапфир x'+sapphireGain+'!','important');
      checkAchievement('sapphire_owner');
    }
    state.kills = (state.kills || 0) + 1;
    if(wasQuest){
      addLog('📜 Задание «'+questName+'» выполнено!','important');
      addLog('Награда: +'+xpGain+' XP, +'+goldGain+' 🪙','important');
    }else{
      addLog('Победа! +'+xpGain+' XP, +'+goldGain+' 🪙','important');
    }
    // Босс Башни
    if(e.isBoss && e.floorId){
      onTowerBossDefeated(e);
      if(e.id) unlockCodex('bosses', e.id, false);
    }else if(e && e.id){
      unlockCodex('enemies', e.id, false);
    }
    const loot=ENEMY_LOOT[e.id]||[];
    loot.forEach(d=>{if(Math.random()<d.chance)addItem(ITEMS[d.item])});
    checkLevelUp();
    checkAchievement('first_blood');
    if(state.kills >= 15) checkAchievement('slayer');
    // После квеста возвращаемся к Главным воротам — до таверны идти самому
    if(wasQuest){
      state.location = 'gate';
      addLog('Ты возвращаешься к Главным воротам города.');
    }
  }else if(!won){
    addLog('Ты падаешь... Всё темнеет.','important');
    state.hp=Math.floor(state.maxHp*0.3);
    const loss=Math.floor(state.gold*0.1);
    if(loss>0){state.gold-=loss;addLog('Потеряно '+loss+' 🪙')}
    state.location='home';
    addLog('Ты приходишь в себя дома. Кто-то помог.');
    checkAchievement('survivor');
  }
  state.enemy=null;
  state.currentQuest=null;
  updateUI();
  // Если были в Башне — возвращаемся на этаж (HP не восстанавливается)
  if(state.location === 'tower'){
    renderTowerFloor();
  }else{
    renderLocation();
  }
  save();
}
function checkLevelUp(){
  while(state.level<MAX_LEVEL&&state.xp>=XP_TABLE[state.level]){
    state.xp-=XP_TABLE[state.level];
    state.level++;
    state.maxHp+=8;
    state.hp=state.maxHp;
    state.stats.strength+=1;
    state.stats.defense+=1;
    // Как в Легенде о вампире — энергия восстанавливается при повышении уровня
    state.energy = state.maxEnergy;
    addLog('✨ Уровень повышен! Теперь '+state.level,'important');
    addLog('⚡ Энергия полностью восстановлена!','important');
  }
  checkAchievementTriggers();
}

function restoreEnergy(type){
  if(!state)return;
  if(state.energy >= state.maxEnergy){
    addLog('Энергия уже полная.','danger');
    renderTavern();
    return;
  }
  const cost = type === 1 ? 30 : 80;
  const amount = type === 1 ? 3 : 8;
  if(state.gold < cost){
    addLog('Не хватает монет.','danger');
    renderTavern();
    return;
  }
  state.gold -= cost;
  state.energy = Math.min(state.maxEnergy, state.energy + amount);
  addLog((type===1?'🍺 Кружка эля':'🏺 Кувшин эля')+': +'+amount+' ⚡','important');
  updateUI();
  renderTavern();
  save();

// ========== ЗАДАНИЯ ==========
function getQuestById(questId){
  return QUESTS.find(x=>x.id===questId) || TOWER_KEY_QUESTS.find(x=>x.id===questId) || null;
}
function startQuest(questId){
  const q=getQuestById(questId);
  if(!q)return;
  if(state.energy<q.energyCost){addLog('Недостаточно энергии.','danger');renderTavern();return}
  if(state.activeQuests.length>=5){addLog('Максимум заданий.','danger');renderTavern();return}
  // Ключевые квесты — только один раз
  if(q.keyId && hasTowerKey(q.keyId)){
    addLog('У тебя уже есть этот ключ.','danger');
    renderTavern();
    return;
  }
  if(q.reqLevel && state.level < q.reqLevel){
    addLog('Нужен уровень '+q.reqLevel+'.','danger');
    renderTavern();
    return;
  }
  state.energy-=q.energyCost;
  const now=Date.now();
  state.activeQuests.push({questId:q.id,startedAt:now,endsAt:now+q.duration*1000,status:'traveling'});
  addLog('📜 Задание принято: «'+q.name+'»','important');
  save();updateUI();renderTavern();
}
function checkActiveQuests(){
  if(!state||!state.activeQuests||!state.activeQuests.length)return;
  const now=Date.now();
  const toStart=[];
  state.activeQuests=state.activeQuests.filter(aq=>{
    if(aq.status==='traveling'&&now>=aq.endsAt){
      const q=getQuestById(aq.questId);
      if(!q)return false;
      aq.status='combat';
      toStart.push(q);
      return false;
    }
    return true;
  });
  toStart.forEach(q=>{
    const enemy=ENEMIES.find(e=>e.id===q.enemyId)||ENEMIES[0];
    addLog('⚔️ Ты прибыл: '+LOCATIONS[q.location].name);
    addLog('На тебя нападает '+enemy.name+'!','important');
    state.currentQuest = q.id; // сохраняем квест, чтобы выдать награду после боя
    setTimeout(()=>startCombat(enemy),500);
  });
}
function showQuestBoard(){
  let h='<h3>📜 Доска заданий</h3>'+
    '<p style="color:var(--text-dim);font-size:.85rem;margin-bottom:12px">Основная доска в городе. Задания берутся в таверне у Странника Рея.</p>'+
    '<button class="btn btn-secondary" style="width:100%" onclick="closeModal()">Закрыть</button>';
  showModalRaw(h);
}

// ========== ИНВЕНТАРЬ ==========
function addItem(item,qty){
  if(!item)return false;
  qty=qty||1;
  if(item.type==='material'||item.type==='potion'||item.type==='quest'){
    const ex=state.inventory.find(i=>i.id===item.id);
    if(ex){ex.qty=(ex.qty||1)+qty;addLog('+'+qty+' '+item.name);save();return true}
  }
  if(state.inventory.length>=state.maxSlots){
    addLog('⚠️ Инвентарь полон!','danger');
    return false;
  }
  const copy=Object.assign({},item);
  if(item.type==='material'||item.type==='potion'||item.type==='quest')copy.qty=qty;
  state.inventory.push(copy);
  addLog('+'+qty+' '+item.name);
  save();
  return true;
}
function removeItem(itemId,qty){
  qty=qty||1;
  const idx=state.inventory.findIndex(i=>i.id===itemId);
  if(idx===-1)return false;
  const item=state.inventory[idx];
  if(item.qty&&item.qty>qty)item.qty-=qty;
  else state.inventory.splice(idx,1);
  save();return true;
}
function hasItem(itemId,qty){
  qty=qty||1;
  const item=state.inventory.find(i=>i.id===itemId);
  return !!(item&&((item.qty||1)>=qty));
}
function useItem(itemId){
  const item=state.inventory.find(i=>i.id===itemId);
  if(!item)return;
  if(item.type==='potion'){
    if(item.heal){state.hp=Math.min(state.maxHp,state.hp+item.heal);addLog('+'+item.heal+' HP','important')}
    if(item.stamina){state.stamina=Math.min(state.maxStamina,state.stamina+item.stamina);addLog('+'+item.stamina+' ⚡')}
    removeItem(itemId,1);updateUI();renderInventory();
  }else if(item.type==='weapon'){
    state.equipped.weapon=item.id;
    addLog('Экипировано: '+item.name,'important');
    renderInventory();save();
  }else if(item.type==='armor'){
    state.equipped.armor=item.id;
    addLog('Экипировано: '+item.name,'important');
    renderInventory();save();
  }
}
function unequipItem(slot){
  if(!state.equipped)return;
  if(slot==='weapon' && state.equipped.weapon){
    addLog('Снято: '+ITEMS[state.equipped.weapon].name);
    state.equipped.weapon=null;
  }else if(slot==='armor' && state.equipped.armor){
    addLog('Снято: '+ITEMS[state.equipped.armor].name);
    state.equipped.armor=null;
  }
  renderInventory();save();
}
function sellItem(itemId){
  const item=state.inventory.find(i=>i.id===itemId);
  if(!item || item.type==='quest' || item.type==='key')return;
  const basePrice = item.price || 1;
  const sellPrice = Math.max(1, Math.floor(basePrice * 0.4));
  const qty = item.qty || 1;
  // Продаём одну штуку
  removeItem(itemId, 1);
  state.gold += sellPrice;
  addLog('Продано: '+item.name+' за '+sellPrice+' 🪙','important');
  updateUI();
  renderInventory();
  save();
}

  const recipe=ALCHEMY_RECIPES.find(r=>r.result===resultId);
  if(!recipe)return;
  for(const entry of Object.entries(recipe.ingredients)){
    if(!hasItem(entry[0],entry[1]))return;
  }
  for(const entry of Object.entries(recipe.ingredients)){
    removeItem(entry[0],entry[1]);
  }
  addItem(ITEMS[resultId]);
  state.craftedPotions = (state.craftedPotions || 0) + 1;
  if(state.craftedPotions === 1) checkAchievement('alchemist');
  addLog('«Отлично. Реакция прошла как надо.»','important');
  updateUI();showAlchemyCraft();save();
}

// ========== ВРЕМЯ И ПОГОДА ==========
function updateTimeAndWeather(){
  if(!state)return;
  const now=new Date();
  const h=now.getHours();
  const oldPhase=state.timePhase;
  const oldWeather=state.weather;
  if(TIME_PHASES.dawn.hours.includes(h))state.timePhase='dawn';
  else if(TIME_PHASES.day.hours.includes(h))state.timePhase='day';
  else if(TIME_PHASES.evening.hours.includes(h))state.timePhase='evening';
  else state.timePhase='night';
  const wi=30*60*1000;
  if(!state.lastWeatherUpdate||now.getTime()-state.lastWeatherUpdate>wi){
    const roll=Math.random();
    if(roll<0.55)state.weather='clear';
    else if(roll<0.8)state.weather='rain';
    else if(roll<0.95)state.weather='fog';
    else state.weather='storm';
    state.lastWeatherUpdate=now.getTime();
    if(oldWeather&&oldWeather!==state.weather){
      addLog('🌦️ Погода изменилась: '+WEATHERS[state.weather].name);
    }
  }
  if(oldPhase&&oldPhase!==state.timePhase){
    addLog(TIME_PHASES[state.timePhase].icon+' Наступило: '+TIME_PHASES[state.timePhase].name);
  }
}
function checkEnergyRestore(){
  if(!state)return;
  const now=new Date();
  const t4=new Date(now);
  t4.setHours(4,0,0,0);
  const last=new Date(state.lastEnergyRestore||0);
  if(now>=t4&&last<t4){
    state.energy=state.maxEnergy;
    state.lastEnergyRestore=now.getTime();
    addLog('⚡ Энергия восстановлена!','important');
    save();
  }
}

function enterTower(){
  if(!state.towerMaxFloor) state.towerMaxFloor=0;
  if(!state.towerFloor) state.towerFloor=0;
  // Первый этаж требует ключ с квеста 5 уровня
  if(!hasTowerKey('key_floor1')){
    addLog('Башня закрыта. Нужен ключ от 1 этажа. Возьми задание на ключ в таверне (с 5 уровня).','danger');
    return;
  }
  if(state.level < 5){
    addLog('Ты ещё слишком слаб для Башни. Нужен 5 уровень.','danger');
    return;
  }
  state.location='tower';
  // Ставим на максимальный доступный этаж с ключом
  let target = 1;
  for(let i=9;i>=1;i--){
    const f = TOWER_FLOORS.find(x=>x.id===i);
    if(f && hasTowerKey(f.keyId) && state.level >= f.minLevel){
      target = i;
      break;
    }
  }
  // Если уже были выше и босс побеждён — можно на следующий при наличии ключа
  if(state.towerFloor > 0 && state.towerFloor <= 9){
    target = state.towerFloor;
  }
  state.towerFloor = target;
  addLog('Ты входишь в Башню «Ночные легенды». Холод и тишина.');
  codexUnlockLocation('tower');
  codexUnlockLocation('tower_approach');
  renderTowerFloor();
  save();
}
function hasTowerKey(keyId){
  if(!keyId) return true;
  if(state.towerKeys && state.towerKeys[keyId]) return true;
  // Также проверяем инвентарь
  return (state.inventory||[]).some(i => i.id === keyId);
}
function renderTowerFloor(){
  if(!state || state.location !== 'tower') return;
  const floorNum = state.towerFloor || 1;
  const floor = TOWER_FLOORS.find(f => f.id === floorNum);
  if(!floor){
    addLog('Выше пути нет.');
    state.location='tower_approach';
    renderLocation();
    return;
  }
  if(state.level < floor.minLevel){
    addLog('Для этого этажа нужен уровень '+floor.minLevel+'.','danger');
    state.towerFloor = Math.max(1, floorNum-1);
    renderTowerFloor();
    return;
  }
  if(floor.keyId && !hasTowerKey(floor.keyId)){
    addLog('Нужен ключ: '+ (ITEMS[floor.keyId]?ITEMS[floor.keyId].name:'ключ')+'. Победи босса предыдущего этажа.','danger');
    state.towerFloor = Math.max(1, floorNum-1);
    renderTowerFloor();
    return;
  }
  $('loc-name').textContent='🗼 Этаж '+floor.id+': '+floor.name;
  $('loc-desc').textContent=floor.desc;
  const bossDefeated = (state.towerBossesDefeated||[]).includes(floor.id);
  let html='<div class="panel"><div class="panel-title">Этаж '+floor.id+' / 9</div>'+
    '<p style="font-size:.9rem;color:var(--text-dim);margin-bottom:12px">'+floor.desc+'</p>'+
    '<p style="font-size:.85rem;margin-bottom:8px">❤️ HP: <b>'+state.hp+'/'+state.maxHp+'</b> (не восстанавливается автоматически)</p>';
  if(floor.keyId){
    html+='<p style="font-size:.8rem;color:var(--accent2)">🔑 Ключ: '+(ITEMS[floor.keyId]?ITEMS[floor.keyId].name:'есть')+'</p>';
  }
  html+='</div>';
  html+='<div class="panel"><div class="panel-title">Действия</div><div class="actions">';
  if(!bossDefeated){
    html+='<button class="action-btn" onclick="doAction(\'tower_fight\')"><span class="icon">⚔️</span><span>Искать противников</span></button>';
    html+='<button class="action-btn" onclick="doAction(\'tower_boss\')"><span class="icon">'+floor.boss.icon+'</span><span>Вызвать босса: '+floor.boss.name+'</span></button>';
  }else{
    html+='<p style="color:var(--accent2);margin-bottom:10px">✓ Босс этажа побеждён</p>';
    if(floor.id < 9){
      const nextFloor = TOWER_FLOORS.find(f => f.id === floor.id+1);
      const canNext = nextFloor && (!nextFloor.keyId || hasTowerKey(nextFloor.keyId));
      if(canNext){
        html+='<button class="action-btn" onclick="doAction(\'tower_next\')"><span class="icon">⬆️</span><span>Подняться на этаж '+(floor.id+1)+'</span></button>';
      }else{
        html+='<p style="font-size:.85rem;color:var(--text-dim)">Нужен ключ от следующего этажа</p>';
      }
    }else{
      html+='<p style="color:var(--accent2);font-weight:600">🏆 Ты покорил первые 9 этажей Башни!</p>';
    }
  }
  html+='<button class="action-btn" onclick="doAction(\'tower_leave\')"><span class="icon">🚪</span><span>Покинуть Башню</span></button>';
  html+='</div></div>';
  if(state.log.length){
    html+='<div class="panel"><div class="panel-title">Недавнее</div><div class="log">';
    state.log.slice(0,3).forEach(l=>{html+='<p class="'+l.cls+'">'+l.text+'</p>'});
    html+='</div></div>';
  }
  $('content').innerHTML=html;
}
function towerFightTrash(){
  const floor = TOWER_FLOORS.find(f => f.id === state.towerFloor);
  if(!floor || !floor.trash.length) return;
  const enemy = Object.assign({}, floor.trash[Math.floor(Math.random()*floor.trash.length)]);
  enemy.currentHp = enemy.hp;
  state.enemy = enemy;
  state.inCombat = true;
  state.combatBusy = false;
  state.currentQuest = null; // не квест
  addLog('⚔️ На тебя нападает '+enemy.name+'!','important');
  updateUI();
  renderCombat();
}
function towerFightBoss(){
  const floor = TOWER_FLOORS.find(f => f.id === state.towerFloor);
  if(!floor) return;
  if((state.towerBossesDefeated||[]).includes(floor.id)){
    addLog('Этот босс уже побеждён.');
    renderTowerFloor();
    return;
  }
  const boss = Object.assign({}, floor.boss);
  boss.currentHp = boss.hp;
  boss.isBoss = true;
  boss.floorId = floor.id;
  boss.phase = 1;
  state.enemy = boss;
  state.inCombat = true;
  state.combatBusy = false;
  state.currentQuest = null;
  addLog('⚔️ Появляется '+boss.name+'!','important');
  if(boss.phases > 1) addLog('У босса несколько фаз. Будь осторожен.','danger');
  updateUI();
  renderCombat();
}
function towerNextFloor(){
  const current = state.towerFloor || 1;
  if(current >= 9){
    addLog('Выше пути нет. Ты на вершине.');
    renderTowerFloor();
    return;
  }
  if(!(state.towerBossesDefeated||[]).includes(current)){
    addLog('Сначала победи босса этого этажа.','danger');
    renderTowerFloor();
    return;
  }
  state.towerFloor = current + 1;
  if(state.towerFloor > (state.towerMaxFloor||0)) state.towerMaxFloor = state.towerFloor;
  addLog('⬆️ Ты поднимаешься на этаж '+state.towerFloor+'.');
  renderTowerFloor();
  save();
}
function onTowerBossDefeated(boss){
  if(!boss || !boss.floorId) return;
  if(!state.towerBossesDefeated) state.towerBossesDefeated = [];
  if(state.towerBossesDefeated.includes(boss.floorId)) return;
  state.towerBossesDefeated.push(boss.floorId);
  if(boss.floorId > (state.towerMaxFloor||0)) state.towerMaxFloor = boss.floorId;
  addLog('🏆 Босс этажа '+boss.floorId+' побеждён!','important');
  const floor = TOWER_FLOORS.find(f => f.id === boss.floorId);
  if(floor && floor.boss && floor.boss.reward){
    const r = floor.boss.reward;
    if(r.extraGold){
      state.gold += r.extraGold;
      addLog('💰 Бонус: +'+r.extraGold+' 🪙','important');
    }
    if(r.equip && ITEMS[r.equip]){
      addItem(ITEMS[r.equip]);
      addLog('⚔️ Трофей: '+ITEMS[r.equip].name+'!','important');
    }
    if(r.sapphire){
      state.sapphire = (state.sapphire||0) + r.sapphire;
      addLog('🔷 Получен сапфир x'+r.sapphire+'!','important');
      checkAchievement('sapphire_owner');
    }
    if(r.title){
      addLog('🏆 Титул получен: «'+r.title+'»','important');
    }
  }
  if(boss.floorId === 9){
    checkAchievement('tower_conqueror');
  }
}

// ========== ГЛОБАЛЬНЫЙ ТАЙМЕР ==========
setInterval(()=>{
  if(!state)return;
  if(state.activeQuests&&state.activeQuests.length>0)checkActiveQuests();
  checkEnergyRestore();
  updateTimeAndWeather();
  if(state.isTravelling){renderTravelScreen();return}
  if(!state.inCombat){
    updateUI();
    // Обновляем таверну, если открыта и модалка не показана
    if(state.location==='tavern'&&$('screen-game').classList.contains('active')&&!$('modal').classList.contains('show')){
      if(!window._lastTR||Date.now()-window._lastTR>3000){
        window._lastTR=Date.now();
        renderTavern();
      }
    }
  }
},1000);

// ========== ИНИЦИАЛИЗАЦИЯ ==========
if(localStorage.getItem(SAVE_KEY)){
  $('btn-continue').style.display='inline-block';
  $('btn-reset').style.display='inline-block';
}
</script>
</body>
</html>
